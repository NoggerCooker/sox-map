<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Natriumdampflampen aus OpenStreetMap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--high:#ff9800;--low:#e53935;--unknown:#000}
html,body,#map{height:100%;margin:0}
.panel{position:absolute;z-index:1000;top:12px;left:55px;width:min(470px,calc(100% - 85px));
background:#fff;padding:14px;border-radius:9px;box-shadow:0 2px 14px #0004;font:14px Arial}
h3{margin:0 0 8px}.muted{font-size:12px;color:#666;line-height:1.35}
button{padding:8px 12px;margin:8px 5px 8px 0;border:1px solid #aaa;border-radius:5px;background:#f7f7f7;cursor:pointer}
button:disabled{cursor:wait;opacity:.65}
#status{margin:7px 0;line-height:1.4}.error{color:#b00020}
.progress{height:6px;margin:8px 0;background:#eee;border-radius:4px;overflow:hidden}
.progress[hidden]{display:none}.progress-bar{height:100%;width:35%;background:#555;border-radius:4px}
.progress-bar.active{animation:progress 1.2s ease-in-out infinite alternate}
@keyframes progress{from{margin-left:0;width:22%}to{margin-left:78%;width:22%}}
.legend{line-height:1.8}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend .high{background:var(--high)}.legend .low{background:var(--low)}.legend .unknown{background:var(--unknown)}
.meta{font-size:12px;color:#555;margin-top:5px}
table{border-collapse:collapse}td{padding-right:12px;vertical-align:top}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<h3>🟠 Natriumdampflampen – weltweit</h3>
<div id="status">Bereit.</div>
<div id="progress" class="progress" hidden><div id="progressBar" class="progress-bar"></div></div>
<button id="load">Daten laden</button>
<button id="turbo">In Overpass Turbo öffnen</button>
<div id="stats"></div>
<div class="muted">
Datenquelle: OpenStreetMap. Die Karte zeigt weltweit Straßenlampen, bei denen
OSM einen Natrium-Leuchtmitteltyp erfasst hat. Eine fehlende Markierung
bedeutet nicht, dass die reale Lampe kein Natrium verwendet.
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([20,0],2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:20,attribution:'© OpenStreetMap-Mitwirkende'}).addTo(map);
const layer=L.layerGroup().addTo(map);

const OVERPASS_TIMEOUT_SECONDS=120;
const REQUEST_TIMEOUT_MS=(OVERPASS_TIMEOUT_SECONDS+10)*1000;
const Q=`[out:json][timeout:${OVERPASS_TIMEOUT_SECONDS}];
(
  nwr["highway"="street_lamp"]
     ["lamp_type"~"^(low_pressure_sodium|low-pressure_sodium|SOX|sodium_vapor|high_pressure_sodium|high-pressure_sodium|HPS|SON)$",i];

  nwr["highway"="street_lamp"]
     ["light:method"~"^(low_pressure_sodium|low-pressure_sodium|SOX|sodium_vapor|high_pressure_sodium|high-pressure_sodium|HPS|SON)$",i];

  nwr["highway"="street_lamp"]
     ["light_source"~"^(low_pressure_sodium|low-pressure_sodium|SOX|sodium_vapor|high_pressure_sodium|high-pressure_sodium|HPS|SON)$",i];

  nwr["highway"="street_lamp"]
     ["lamp_model"~"SOX|low.?pressure.?sodium|HPS|high.?pressure.?sodium|SON",i];
);
out center;`;

const endpoints=[
"https://overpass.private.coffee/api/interpreter",
"https://overpass-api.de/api/interpreter"
];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatBytes(bytes){
 if(bytes<1024) return `${bytes} B`;
 if(bytes<1024*1024) return `${(bytes/1024).toFixed(1)} KiB`;
 return `${(bytes/(1024*1024)).toFixed(2)} MiB`;
}
function typeOf(t){
 const s=[t.lamp_type,t["light:method"],t.light_source,t.lamp_model]
   .filter(Boolean).join("|").toLowerCase();
 if(s.includes("high_pressure_sodium")||s.includes("high-pressure_sodium")||s.includes("hps")||s.includes("son")) return "Natrium-Hochdruck";
 if(s.includes("low_pressure_sodium")||s.includes("low-pressure_sodium")||s.includes("sox")) return "Natrium-Niederdruck";
 return "Natrium – Typ unbekannt";
}
function markerStyle(type){
 if(type==="Natrium-Hochdruck") return {color:"#8a4b00",fillColor:"#ff9800"};
 if(type==="Natrium-Niederdruck") return {color:"#8b0000",fillColor:"#e53935"};
 return {color:"#000",fillColor:"#000"};
}
function popup(e,type){
 let rows="";
 for(const [k,v] of Object.entries(e.tags||{}))
   rows+=`<tr><td><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`;
 return `<b>${esc(type)}</b><br><table>${rows}</table>
 <a target="_blank" rel="noopener noreferrer" href="https://www.openstreetmap.org/${e.type}/${e.id}">OSM-Objekt öffnen</a>`;
}

async function request(url){
 const full=url+"?data="+encodeURIComponent(Q);
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),REQUEST_TIMEOUT_MS);
 try{
   const r=await fetch(full,{method:"GET",headers:{"Accept":"application/json"},
     cache:"no-store",signal:controller.signal});
   if(!r.ok){
     const text=await r.text();
     throw new Error("HTTP "+r.status+(text?": "+text.slice(0,180):""));
   }
   const text=await r.text();
   return {data:JSON.parse(text),bytes:new TextEncoder().encode(text).byteLength};
 } finally {clearTimeout(timer);}
}

async function load(){
 const loadButton=document.getElementById("load");
 const progress=document.getElementById("progress");
 const progressBar=document.getElementById("progressBar");
 const status=document.getElementById("status");
 const stats=document.getElementById("stats");
 layer.clearLayers();
 stats.innerHTML="";
 loadButton.disabled=true;
 progress.hidden=false;
 progressBar.classList.add("active");
 status.textContent="Globale Abfrage wird vorbereitet …";
 let errors=[];
 try{
   for(let i=0;i<endpoints.length;i++){
     const ep=endpoints[i];
     try{
       status.textContent=`Abfrage ${i+1}/${endpoints.length}: ${new URL(ep).hostname} …`;
       const response=await request(ep);
       const arr=response.data.elements||[];
       status.textContent=`Antwort empfangen – ${formatBytes(response.bytes)} werden verarbeitet …`;
       let hp=0,lp=0,other=0;
       const markers=[];
       for(const e of arr){
         if(e.type!=="node"||e.lat==null||e.lon==null) continue;
         const type=typeOf(e.tags||{});
         if(type==="Natrium-Hochdruck") hp++;
         else if(type==="Natrium-Niederdruck") lp++;
         else other++;
         const style=markerStyle(type);
         const marker=L.circleMarker([e.lat,e.lon],{
           radius:5,weight:1,color:style.color,fillColor:style.fillColor,fillOpacity:.9
         }).bindPopup(popup(e,type));
         marker.addTo(layer);
         markers.push(marker);
       }
       progressBar.classList.remove("active");
       progressBar.style.width="100%";
       status.textContent=`Fertig – ${markers.length} passende OSM-Lampen gefunden.`;
       stats.innerHTML=`<div class="legend">
         <i class="high"></i> Natrium-Hochdruck: <b>${hp}</b><br>
         <i class="low"></i> Natrium-Niederdruck: <b>${lp}</b><br>
         <i class="unknown"></i> Typ unbekannt: <b>${other}</b>
         </div><div class="meta">Antwort: <b>${formatBytes(response.bytes)}</b> · OSM-Elemente: <b>${arr.length}</b> · dargestellte Knoten: <b>${markers.length}</b></div>`;
       if(markers.length) map.fitBounds(L.featureGroup(markers).getBounds().pad(.04));
       return;
     }catch(e){
       errors.push(new URL(ep).hostname+": "+(e.name==="AbortError"?"Timeout nach "+(REQUEST_TIMEOUT_MS/1000)+" Sekunden":e.message));
     }
   }
   status.innerHTML=`<span class="error"><b>Overpass konnte nicht abgefragt werden.</b><br>${errors.map(esc).join("<br>")}</span>`;
 } finally {
   loadButton.disabled=false;
   progress.hidden=true;
   progressBar.classList.remove("active");
   progressBar.style.width="35%";
 }
}

const turboQ=encodeURIComponent(Q);
document.getElementById("turbo").onclick=()=>{
 window.open("https://overpass-turbo.eu/?C="+encodeURIComponent("{{style:\nnode[highway=street_lamp] { color: #000000; fill-color: #000000; }\n}}")+
 "&Q="+turboQ,"_blank");
};
document.getElementById("load").onclick=load;
load();
</script>
</body>
</html>
